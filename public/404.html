<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไม่พบหน้าที่ต้องการ - 404</title>
    <link rel="stylesheet" href="/css/neumorphism.css">
    <link rel="stylesheet" href="/css/utilities.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="min-h-screen flex items-center justify-center">
            <div class="neu-container text-center fade-in">
                <div class="neu-avatar" style="width: 120px; height: 120px; margin: 0 auto var(--space-lg); font-size: 3rem; background: linear-gradient(145deg, var(--error-color), #dc2626); color: white;">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h1 class="text-2xl font-bold mb-md">404</h1>
                <h2 class="text-xl mb-md">ไม่พบหน้าที่ต้องการ</h2>
                <p class="text-lg mb-lg" style="color: var(--text-secondary);">
                    ขออภัย หน้าที่คุณกำลังมองหาไม่มีอยู่
                </p>
                <div class="flex gap-md justify-center">
                    <a href="/" class="neu-button primary">
                        <i class="fas fa-home"></i>
                        กลับหน้าหลัก
                    </a>
                    <button class="neu-button" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i>
                        ย้อนกลับ
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
